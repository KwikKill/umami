name: Publish Docker image

on:
  push:
    branches:
      - master

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/dummy"
      SKIP_DB_CHECK: 1
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm test
      - run: pnpm build

  build:
    name: Build and push image to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          # Image refs must be lowercase; the GitHub owner/repo can contain uppercase letters.
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "tags=ghcr.io/${REPO}:latest,ghcr.io/${REPO}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  cleanup:
    name: Delete old GHCR image versions
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # The `secrets` context can't be used directly in any `if:` (job or
      # step). Copy it into `env` here - env values may reference secrets -
      # then check `env.PACKAGE_TOKEN` in the step's `if:` below instead.
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
    steps:
      # A personal (non-org) GHCR package can't be pruned with the automatic
      # GITHUB_TOKEN - a classic PAT with the delete:packages scope is required.
      # Skip cleanly instead of failing the run until PACKAGE_TOKEN is set.
      - name: Keep only the 10 most recent versions
        if: ${{ env.PACKAGE_TOKEN != '' }}
        uses: actions/delete-package-versions@v5
        with:
          package-name: umami
          package-type: container
          min-versions-to-keep: 10
          token: ${{ env.PACKAGE_TOKEN }}
